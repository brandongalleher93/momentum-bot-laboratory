name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt pip-audit==2.10.1
      - name: Audit dependencies
        run: python -m pip_audit --requirement requirements.txt
      - name: Audit the public tree
        run: python scripts/audit_public_release.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
