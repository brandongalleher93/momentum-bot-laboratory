[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-trading-bot-mvp"
version = "0.2.0"
description = "Paper-only Bull Flag / First Pullback trading bot"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "alpaca-py>=0.43.5,<0.44",
  "python-dotenv>=1.2,<2",
  "tzdata>=2026.3",
]

[project.scripts]
momentum-bot = "bot.cli:main"

[tool.setuptools.packages.find]
include = ["bot*"]
