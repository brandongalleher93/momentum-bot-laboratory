[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-bot-laboratory"
version = "0.2.0"
description = "Educational, paper-only momentum trading research laboratory"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "alpaca-py>=0.43.5,<0.44",
  "python-dotenv>=1.2,<2",
  "tzdata>=2026.3",
  "streamlit>=1.41,<2",
  "plotly>=5.24,<7",
  "pandas>=2.2,<3",
  "pyarrow>=23.0.1,<24",
]

[project.scripts]
momentum-bot = "bot.cli:main"
momentum-gui = "bot.gui:main"

[tool.setuptools.packages.find]
include = ["bot*"]
